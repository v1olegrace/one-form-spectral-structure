name: tests

# A run is evidence only for the commit it ran on. Recorded outcomes and the
# commits they cover are in FINAL_REPORT.md; do not restate them here, where
# they would go stale on the next push. The 2026-09-11 report of that name is
# kept at reports/history/FINAL_REPORT_2026-09-11.md.
#
# Runners are pinned to ubuntu-24.04, the image in which the paper and brief
# builds were reproduced locally; ubuntu-latest moves to Ubuntu 26 from
# 19 October 2026, and a TeX Live or Python change there would otherwise
# arrive unannounced.
#
# Actions are the majors that run on Node 24 (checkout, setup-python and
# upload-artifact v7, checked on 2026-10-03 in each tag's action.yml); the
# v4/v5 majors ran on Node 20, which the runners now force onto Node 24 with a
# deprecation notice. Each is pinned to the commit its v7 tag pointed to on
# 2026-10-24 (git ls-remote), so a moved tag cannot change what runs.
# Python packages are installed with constraints.txt, the exact versions of the
# verified clean rooms, so a new numpy or scipy cannot move the numerical guards.

on:
  push:
    branches: [main, 'remediation/**']
  pull_request:
  workflow_dispatch:

# The token only reads the repository; no step pushes or publishes.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install -c constraints.txt pip
          pip install -r requirements.txt -c constraints.txt

      - name: Test suite
        run: python -m pytest tests -q -rs

      - name: Numerical reproducibility (no network)
        # Byte-level guard on deterministic outputs only. Rendered figures depend
        # on the matplotlib version and system fonts, and extended_verification.json
        # records package versions and QUADPACK error estimates. A clean-room run
        # with numpy 2.5.4, scipy 1.18.1 and matplotlib 3.11.2 changed exactly
        # these and nothing else (.agent/reports/P13.md).
        # The four files below hold float64 values whose last digits depend on the
        # platform: Windows and Ubuntu 24.04, with the same packages, differed in
        # float64 round-off diagnostics and by 1 ulp in a Monte Carlo RMSE
        # (.agent/reports/R6.md). They are compared on scientific content instead.
        # Python's csv module writes CRLF on every platform while the committed
        # files are LF, so line endings are ignored (R6, Ubuntu 24.04).
        run: |
          python make.py numerics
          git diff --ignore-cr-at-eol --exit-code -- output/data ':(exclude)output/data/extended_verification.json' ':(exclude)output/data/localizing_bounds.csv' ':(exclude)output/data/uncertainty_summary.json' ':(exclude)output/data/verification_checks.json' manuscript/numerical_results.qmd paper/figures
          args=""
          for f in extended_verification.json localizing_bounds.csv uncertainty_summary.json verification_checks.json; do
            git show "HEAD:output/data/$f" > "$RUNNER_TEMP/base_$f"
            args="$args $RUNNER_TEMP/base_$f output/data/$f"
          done
          python scripts/compare_numerical_outputs.py $args

      - name: Audit ledgers rebuild cleanly
        run: |
          python make.py audit
          git diff --ignore-cr-at-eol --exit-code -- data/literature_audit.csv data/claims_matrix.csv data/theorem_status.csv

      - name: Bibliography reproduces the committed files (offline)
        run: |
          python make.py bib
          git diff --exit-code -- paper/references.bib data/literature_harvest.json data/literature_harvest.csv

      - name: Fail if generated or cache artifacts are tracked
        run: |
          if git ls-files | grep -E '(^tmp/|chrome_profile|__pycache__|\.pytest_cache|^output/html/|^output/pdf/|^output/certified_one_loop/)'; then
            echo "Generated/cache artifacts are tracked in version control"; exit 1
          fi

  certified:
    # Validated-continuum backend (Arb via python-flint). Without it,
    # tests/test_one_loop_certified.py is skipped, so the plain `tests` job
    # alone does not exercise the certification protocol.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Install core + certified dependencies
        run: |
          python -m pip install -c constraints.txt pip
          pip install -r reproducibility/requirements-certified.txt -c constraints.txt

      - name: Backend present (otherwise the certified tests would silently skip)
        run: python -c "import flint; print('python-flint', flint.__version__)"

      - name: Certified tests, with any skip treated as failure
        run: |
          set -o pipefail
          python -m pytest tests/test_one_loop_certified.py tests/test_one_loop_verifier.py tests/test_spectral_weight_certificates.py -q -rs | tee pytest.out
          if grep -q "skipped" pytest.out; then echo "certified tests were skipped"; exit 1; fi

      - name: Generate the one-loop certificates
        run: python make.py certified

      - name: Independent re-verification with Arb re-integration
        run: python reproducibility/verify_one_loop_output.py --reintegrate

  paper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install -c constraints.txt pytest

      - name: LaTeX structural validation
        run: python -m pytest tests/test_latex_structure.py tests/test_bibliography.py -q

      - name: Install TeX Live
        run: |
          sudo apt-get update
          # lmodern is a SEPARATE Debian package. Under --no-install-recommends
          # it is not pulled in, and professor_brief.tex dies with
          #   ! LaTeX Error: File `lmodern.sty' not found.
          # Run 36543772146 failed exactly there. The canonical paper does not
          # use lmodern, which is why only the brief broke.
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended \
            texlive-latex-extra texlive-science latexmk lmodern

      - name: Clean build gate (any warning, overfull box or undefined reference fails)
        # latexmk below exits 0 on warnings, and the tests job has no TeX, so
        # test_paper_compiles_cleanly would otherwise always be skipped.
        run: |
          set -o pipefail
          python -m pytest tests/test_paper_build.py::test_paper_compiles_cleanly -q -rs | tee paper_build.out
          if grep -q "skipped" paper_build.out; then echo "the clean-build test was skipped"; exit 1; fi

      - name: Build paper
        run: cd paper && latexmk -pdf -interaction=nonstopmode paper.tex

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: paper
          path: paper/paper.pdf

      - name: Build Portuguese discussion brief
        run: cd paper && latexmk -pdf -interaction=nonstopmode professor_brief.tex

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: professor-brief
          path: paper/professor_brief.pdf
