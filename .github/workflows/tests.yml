name: tests

# NOTE: this workflow has NOT been executed in the development environment,
# which has no CI runner. It must not be scored as passing until it runs green.
# Current verification status: README.md ("Verification status") and
# reports/AUDIT_REMEDIATION_2026-09-23.md. FINAL_REPORT.md is a historical
# record and is no longer the status source.

on:
  push:
    branches: [main, 'remediation/**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test suite
        run: python -m pytest tests -q

      - name: Numerical reproducibility (no network)
        run: python make.py numerics

      - name: Audit ledgers rebuild cleanly
        run: python make.py audit

      - name: Fail if generated or cache artifacts are tracked
        run: |
          if git ls-files | grep -E '(^tmp/|chrome_profile|__pycache__|\.pytest_cache|^output/html/|^output/pdf/|^output/certified_one_loop/)'; then
            echo "Generated/cache artifacts are tracked in version control"; exit 1
          fi

  certified:
    # Validated-continuum backend (Arb via python-flint). Without it,
    # tests/test_one_loop_certified.py is skipped, so the plain `tests` job
    # alone does not exercise the certification protocol.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install core + certified dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r reproducibility/requirements-certified.txt

      - name: Backend present (otherwise the certified tests would silently skip)
        run: python -c "import flint; print('python-flint', flint.__version__)"

      - name: Certified tests, with any skip treated as failure
        run: |
          set -o pipefail
          python -m pytest tests/test_one_loop_certified.py tests/test_one_loop_verifier.py tests/test_spectral_weight_certificates.py -q -rs | tee pytest.out
          if grep -q "skipped" pytest.out; then echo "certified tests were skipped"; exit 1; fi

      - name: Generate the one-loop certificates
        run: python make.py certified

      - name: Independent re-verification with Arb re-integration
        run: python reproducibility/verify_one_loop_output.py --reintegrate

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest

      - name: LaTeX structural validation
        run: python -m pytest tests/test_latex_structure.py tests/test_bibliography.py -q

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended \
            texlive-latex-extra texlive-science latexmk

      - name: Build paper
        run: cd paper && latexmk -pdf -interaction=nonstopmode paper.tex

      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf

      - name: Build Portuguese discussion brief
        run: cd paper && latexmk -pdf -interaction=nonstopmode professor_brief.tex

      - uses: actions/upload-artifact@v4
        with:
          name: professor-brief
          path: paper/professor_brief.pdf
