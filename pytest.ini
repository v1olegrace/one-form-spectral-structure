[pytest]
# Scope collection to the canonical suite. Without this, a bare
# `python -m pytest` at the repository root aborts with import-file-mismatch
# errors: the preserved, untracked working copy under
# `laplace/physics_of_all_v0.2_update/tests/` carries colliding test basenames
# (test_bibliography, test_latex_structure, test_paper_build).
testpaths = tests
norecursedirs = laplace base_cientifica manuscript tmp output notes figures .git *.egg-info
